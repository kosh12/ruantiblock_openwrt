name: Build ruantiblock packages

on:
  workflow_dispatch:
    inputs:
      owrt_version:
        description: "OpenWrt version"
        required: true
        default: "25.12.6"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OWRT_VERSION: ${{ github.event.inputs.owrt_version || '25.12.6' }}
  TARGET_DIR: "x86/64"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Cache SDK tarball
        id: cache-sdk
        uses: actions/cache@v5
        with:
          path: /tmp/openwrt-sdk.tar.zst
          key: sdk-${{ env.OWRT_VERSION }}-${{ env.TARGET_DIR }}

      - name: Download SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://downloads.openwrt.org/releases/${OWRT_VERSION}/targets/${TARGET_DIR}"
          SDK_FILE=$(curl -sL "${BASE}/" | grep -oE 'openwrt-sdk-[^"]*\.tar\.zst' | head -1)
          echo "SDK_FILE=${SDK_FILE}"
          curl -L -o /tmp/openwrt-sdk.tar.zst "${BASE}/${SDK_FILE}"
          curl -L -o /tmp/sha256sums "${BASE}/sha256sums"
          EXPECTED=$(grep -F "${SDK_FILE}" /tmp/sha256sums | head -1 | awk '{print $1}')
          ACTUAL=$(sha256sum /tmp/openwrt-sdk.tar.zst | awk '{print $1}')
          echo "expected: ${EXPECTED}"
          echo "actual:   ${ACTUAL}"
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "checksum mismatch!"
            exit 1
          fi
          echo "SDK checksum OK"

      - name: Extract SDK
        run: |
          mkdir -p "$HOME/sdk"
          tar --zstd -xf /tmp/openwrt-sdk.tar.zst --strip-components=1 -C "$HOME/sdk"

      - name: Update & install feeds
        run: |
          cd "$HOME/sdk"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Link packages into SDK
        run: |
          cd "$HOME/sdk/package"
          ln -sf "$GITHUB_WORKSPACE/ruantiblock" ruantiblock
          ln -sf "$GITHUB_WORKSPACE/ruantiblock-mod-lua" ruantiblock-mod-lua
          ln -sf "$GITHUB_WORKSPACE/ruantiblock-mod-py" ruantiblock-mod-py
          ln -sf "$GITHUB_WORKSPACE/luci-app-ruantiblock" luci-app-ruantiblock
          ls -la

      - name: Build packages
        run: |
          cd "$HOME/sdk"
          make defconfig
          make -j"$(nproc)" package/ruantiblock/compile V=s
          make -j"$(nproc)" package/ruantiblock-mod-lua/compile V=s
          make -j"$(nproc)" package/ruantiblock-mod-py/compile V=s
          make -j"$(nproc)" package/luci-app-ruantiblock/compile V=s

      - name: Collect apks
        run: |
          mkdir -p dist
          find "$HOME/sdk/bin/packages" -name '*.apk' -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ruantiblock-apk-${{ env.OWRT_VERSION }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.apk --clobber
          else
            gh release create "${TAG}" dist/*.apk --title "${TAG}" --notes "Packages for OpenWrt ${OWRT_VERSION} (noarch)."
          fi
